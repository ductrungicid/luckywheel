<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b7410e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vòng Quay">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Vòng Quay May Mắn - Chơi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/resource/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="play-page">
  <div class="page-shell">
    <header class="topbar">
      <nav class="nav-links" aria-label="Điều hướng">
        <a class="nav-icon active" href="/play" aria-label="Chơi">
          <img src="/resource/play.png" alt="">
        </a>
        <a class="nav-icon" href="/settings" aria-label="Cài đặt">
          <img src="/resource/settings.png" alt="">
        </a>
      </nav>
    </header>

    <main class="play-layout">
      <section class="wheel-card">
        <div class="wheel-status">
          <div id="selectedValue" class="selected-value">Sẵn sàng quay</div>
        </div>

        <div class="wheel-stage">
          <div class="wheel-wrap">
            <img class="arrow-icon" src="/resource/triangle-arrow.png" alt="" aria-hidden="true">
            <canvas id="wheelCanvas" width="640" height="640"></canvas>
            <button id="wheelTrigger" class="wheel-trigger" type="button" aria-label="Giữ để quay">
              <span id="wheelTriggerText">Quay</span>
            </button>
          </div>
          <aside class="power-panel" aria-label="Lực quay">
            <div class="power-scale">
              <span>300</span>
              <span>225</span>
              <span>150</span>
              <span>75</span>
              <span>0</span>
            </div>
            <div class="power-meter">
              <div id="powerFill" class="power-fill"></div>
            </div>
            <div class="power-readout">
              <strong id="powerValue">0</strong>
              <span>vòng/phút</span>
            </div>
          </aside>
        </div>

        <p id="statusText" class="status-text wheel-status-note">Nhấn vào tâm vòng quay để bắt đầu.</p>
      </section>
    </main>
  </div>

  <script src="/pwa.js"></script>
  <script src="/app.js"></script>
</body>
</html>
